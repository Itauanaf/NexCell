project_id = "nexcell"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "https://nexcell-two.vercel.app"
additional_redirect_urls = ["https://nexcell-two.vercel.app/"]
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
otp_length = 8
max_frequency = "1m"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"
